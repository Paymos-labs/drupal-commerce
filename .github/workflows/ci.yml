name: SDK guards and PHP compatibility
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  guards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, openssl
          tools: composer:v2
          coverage: none
      - name: Resolve compatible released SDK without a Drupal host
        run: |
          set -euo pipefail
          composer validate --strict --no-check-publish
          mkdir "$RUNNER_TEMP/sdk"
          cd "$RUNNER_TEMP/sdk"
          composer init --name=paymos/drupal-ci --no-interaction
          composer require 'paymos/php-sdk:^1.6.1' --no-interaction
      - name: Guard regressions and syntax
        run: |
          set -euo pipefail
          PAYMOS_SDK_SRC="$RUNNER_TEMP/sdk/vendor/paymos/php-sdk/src" php tests/run.php
          find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l commerce_paymos.module
          php -l commerce_paymos.install
